<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Futu-Frenchie Snack Shack - Reservations</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">
	  
	<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="images/logo.png" alt="Restaurant Logo" width="50" class="me-2">
            Futu-Frenchie Snack Shack
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="menu.html">Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="reservations.html">Reservations</a>
                </li>
            </ul>
        </div>

    </div>
	</nav>
</header>

<main>

<main class="container my-5">
	<section class="frenchie-card">

    <h1 class="text-center mb-4">Reservations</h1>

    <div id="messageArea"></div>

    <form id="reservationForm">

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text"
                   id="name"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email"
                   id="email"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label for="partySize" class="form-label">Party Size</label>

            <select id="partySize" class="form-select">
                <option value="">Choose</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date"
                   id="date"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label for="time" class="form-label">Time</label>
            <input type="time"
                   id="time"
                   class="form-control">
        </div>

        <fieldset class="mb-3">
            <legend>Seating Preference</legend>

            <input type="radio"
                   name="seating"
                   value="Indoor"
                   id="indoor">

            <label for="indoor">Indoor</label>

            <input type="radio"
                   name="seating"
                   value="Outdoor"
                   id="outdoor">

            <label for="outdoor">Outdoor</label>
        </fieldset>

        <div class="mb-3">
            <label for="notes" class="form-label">
                Dietary Notes
            </label>

            <input type="text"
                   id="notes"
                   class="form-control">
        </div>

        <div class="form-check mb-3">
            <input type="checkbox"
                   id="newsletter"
                   class="form-check-input">

            <label for="newsletter"
                   class="form-check-label">
                Sign up for newsletter
            </label>
        </div>

        <button type="submit" class="btn btn-primary">
            Submit
        </button>

        <button type="reset" class="btn btn-secondary">
            Reset
        </button>

    </form>
	</section>
	</main>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
